        function toWebp(rawPath) {
            if (!rawPath) return '';
            const clean = String(rawPath).trim();
            if (!clean) return '';
            if (/\.webp(\?.*)?$/i.test(clean)) return clean;
            if (/\.(png|jpg|jpeg|gif|svg|avif)(\?.*)?$/i.test(clean)) {
                return clean.replace(/\.(png|jpg|jpeg|gif|svg|avif)(\?.*)?$/i, '.webp$2');
            }
            return `${clean}.webp`;
        }
        function isPetDrop(drop) {
            if (!drop || typeof drop !== 'object') return false;
            if (drop.type === 'pet' || drop.type === 'pet_item') return true;

            const rawId = drop.entityId ?? drop.id ?? drop.elementId ?? '';
            const idStr = String(rawId).trim();
            const entry = idStr !== ''
                ? (catalogById.get(idStr) || catalogByAsset.get(idStr) || catalogIndex.get(idStr))
                : null;

            if (entry && Number(entry.categoryId) === 9) return true;
            return false;
        }


        function indexCatalogItems(data, sourceName) {
            const list = Array.isArray(data) ? data : (Array.isArray(data?.items) ? data.items : []);

                if (!entry || typeof entry !== 'object') continue;
                const keys = [entry.id, entry.elementId, entry.asset]
                    .filter(v => v !== undefined && v !== null && String(v).trim() !== '')
                    .map(v => String(v).trim());

                const info = {
                    source: sourceName,
                    id: entry.id ?? null,
                    elementId: entry.elementId ?? null,
                    asset: entry.asset ? String(entry.asset).trim() : '',
                    name: entry.name ? String(entry.name).trim() : '',
                    categoryId: entry.categoryId ?? null,
                    setLogo: entry.setLogo ? String(entry.setLogo).trim() : '',
                    setId: entry.setId ?? null,
                    zoneId: entry.zoneId ?? entry.zone ?? null
                };

                const idKey = entry.id !== undefined && entry.id !== null ? String(entry.id).trim() : '';
                const assetKey = entry.asset ? String(entry.asset).trim() : '';

                if (idKey && !catalogById.has(idKey)) {
                    catalogById.set(idKey, info);

                if (assetKey && !catalogByAsset.has(assetKey)) {
                    catalogByAsset.set(assetKey, info);
                }

                for (const key of keys) {
                    if (!catalogIndex.has(key)) {
                        catalogIndex.set(key, info);
                    }
                }

        function indexStashSets(data) {
            const setsList = Array.isArray(data) ? data : (Array.isArray(data?.sets) ? data.sets : []);
            for (const setObj of setsList) {
                if (!setObj || typeof setObj !== 'object' || setObj.setId === undefined || setObj.setId === null) continue;
                const setKey = String(setObj.setId).trim();
                const ingredientsMap = new Map();

                if (Array.isArray(setObj.ingredients)) {
                    for (const ing of setObj.ingredients) {
                        if (!ing || typeof ing !== 'object') continue;
                        if (ing.ingredientId !== undefined && ing.ingredientId !== null) {
                            ingredientsMap.set(String(ing.ingredientId).trim(), ing);
                        }
                    }
                }

                stashSetsById.set(setKey, {
                    ...setObj,
                    ingredientsMap
                });
            }
        }

            catalogIndex.clear();
            stashSetsById.clear();

            await Promise.all(

                    try {
                        const res = await fetch(`${file}?t=${Date.now()}`);
                        if (res.ok) {
                            const json = await res.json();
                            if (file === 'sets.json' || Array.isArray(json?.sets)) {
                                indexStashSets(json);
                            } else {
                                indexCatalogItems(json, file);
                            }
                            
                        } else {
                           
                        }

                    }
                })
            );

        function resolveDropWebpCandidates(drop) {
            if (!drop || typeof drop !== 'object') return [];

            const rawId = drop.entityId ?? drop.id ?? drop.elementId ?? '';
            const idStr = String(rawId).trim();
            const byIdEntry = idStr !== '' ? catalogById.get(idStr) : null;
            const byAssetEntry = idStr !== '' ? catalogByAsset.get(idStr) : null;
            const indexEntry = idStr !== '' ? catalogIndex.get(idStr) : null;
            const entry = byIdEntry || byAssetEntry || indexEntry || null;

            
            
            if (drop.type === 'weapon' || drop.type === 'weapon_item') {
                return idStr ? [`data/items/category_1/${idStr}.webp`] : [];
            }
            
            
            if (drop.type === 'stash_ingredient') {
                const setIdStr = drop.setId !== undefined && drop.setId !== null ? String(drop.setId).trim() : '';
                const ingIdStr = drop.ingredientId !== undefined && drop.ingredientId !== null ? String(drop.ingredientId).trim() : '';
                const setObj = setIdStr ? stashSetsById.get(setIdStr) : null;

                if (setObj) {
                    const ingObj = ingIdStr ? setObj.ingredientsMap.get(ingIdStr) : null;
                    const rawUrl = ingObj?.imageUrl || setObj?.previewImageUrl || '';
                    const resolvedUrl = toWebp(rawUrl);
                    if (resolvedUrl) {
                        return [resolvedUrl];
                    }
                }

                return idStr ? [`data/stash/${idStr}.webp`] : [];
            }

            
            if (drop.type === 'pet' || drop.type === 'pet_item') {
                return idStr ? [`data/items/category_9/${idStr}.webp`] : [];
            }

            
            if (drop.type === 'ornament') {
                const setId = drop.setId ?? entry?.setId ?? '';
                const zoneId = drop.zoneId ?? drop.zone ?? entry?.zoneId ?? '';
                if (setId !== '' && zoneId !== '') {
                    return [`data/ornament/set_${setId}_zone_${zoneId}.webp`];
                }
                return [];
            }

            
            if (drop.type === 'clothing_item') {
                const catId = entry?.categoryId ?? drop.categoryId;
                const assetId = (entry?.asset || idStr).toString().trim();

                if (catId && assetId) {
                    return [`data/items/category_${catId}/${assetId}.webp`];
                }
                if (assetId) {
                    const fallbackCats = [];
                    for (let c = 2; c <= 8; c++) {
                        fallbackCats.push(`data/items/category_${c}/${assetId}.webp`);
                    }
                    return fallbackCats;
                }
                return [];
            }

            
            
            if (drop.type === 'activity_item') {
                return idStr ? [`data/activity_item/${idStr}.webp`] : [];
            }

            
            if (drop.type === 'room') {
                return idStr ? [`data/rooms/${idStr}.webp`] : [];
            }

            return [];

        window.toggleClickZoom = function(event, triggerEl) {
            if (event) event.stopPropagation();

            const preview = ensureClickPreviewEl();
            const frameEl = document.getElementById('dropClickPreviewFrame');
            const imgEl = triggerEl.querySelector('img');
            const label = triggerEl.dataset.label || '';
            const src = imgEl ? (imgEl.currentSrc || imgEl.src) : '';
            const isRect = triggerEl.dataset.zoomShape === 'rect';

            if (!imgEl || !src || imgEl.style.display === 'none') {
                hideClickPreview();
                return;
            }

            const activeKey = `${isRect ? 'rect' : 'sq'}::${label}::${src}`;
            if (!preview.classList.contains('hidden') && preview.dataset.activeKey === activeKey) {
                hideClickPreview();
                return;
            }

            if (isRect) {
                frameEl.className = 'rounded-lg border border-red-900/80 overflow-hidden flex items-center justify-center mx-auto';
                frameEl.style.background = 'linear-gradient(145deg, #2b090e 0%, #120406 100%)';
                const rectW = Math.min(540, window.innerWidth - 48);
                const rectH = Math.round(rectW * 0.56);
                frameEl.style.width = `${rectW}px`;
                frameEl.style.height = `${rectH}px`;
            } else {
                frameEl.className = 'rounded-lg border border-red-900/80 overflow-hidden flex items-center justify-center mx-auto';
                frameEl.style.background = 'linear-gradient(145deg, #2b090e 0%, #120406 100%)';
                const sqSize = Math.min(320, window.innerWidth - 48);
                frameEl.style.width = `${sqSize}px`;
                frameEl.style.height = `${sqSize}px`;
            }

            const previewImg = document.getElementById('dropClickPreviewImg');
            const labelEl = document.getElementById('dropClickPreviewLabel');
            previewImg.src = src;
            previewImg.alt = label;
            labelEl.textContent = label;
            preview.dataset.activeKey = activeKey;

            preview.style.visibility = 'hidden';
            preview.style.left = '0px';
            preview.style.top = '0px';
            preview.classList.remove('hidden');

            const rect = triggerEl.getBoundingClientRect();
            const cursorX = (event && typeof event.clientX === 'number' && event.clientX > 0)
                ? event.clientX
                : rect.left + rect.width / 2;
            const cursorY = (event && typeof event.clientY === 'number' && event.clientY > 0)
                ? event.clientY
                : rect.top + rect.height / 2;

            requestAnimationFrame(() => {
                const previewRect = preview.getBoundingClientRect();
                const boxWidth = previewRect.width || (isRect ? 564 : 344);
                const boxHeight = previewRect.height || (isRect ? 350 : 376);
                const margin = 12;

                let left = cursorX - boxWidth / 2;
                left = Math.max(margin, Math.min(left, window.innerWidth - boxWidth - margin));

                let top = cursorY - boxHeight / 2;
                top = Math.max(margin, Math.min(top, window.innerHeight - boxHeight - margin));

                preview.style.left = `${Math.round(left)}px`;
                preview.style.top = `${Math.round(top)}px`;
                preview.style.visibility = 'visible';
            });
        };
        
        window.hideClickPreview = function() {

            if (preview) {
                preview.classList.add('hidden');
                preview.dataset.activeKey = '';
            }
        };

        function renderOrnamentBodyBlock(ornaments) {

        function renderBossDropsLayout(drops) {
    if (!Array.isArray(drops) || drops.length === 0) {
        return `<div class="text-center text-xs font-mono text-gray-500">Нет дропов</div>`;
    }

    const mutagens = [];
    const weapons = [];
    const rooms = [];
    const pets = [];
    const items = [];
    const clothingDrops = [];
    const ornamentDrops = [];
    const stashIngredients = [];

    for (const drop of drops) {
        if (!drop || typeof drop !== 'object') continue;
        if (drop.type === 'mutagen') {
            mutagens.push(drop);
        } else if (drop.type === 'clothing_item') {
            clothingDrops.push(drop);
        } else if (drop.type === 'ornament') {
            ornamentDrops.push(drop);
        } else if (isWeaponDrop(drop)) {
            weapons.push(drop);
        } else if (drop.type === 'room') {
            rooms.push(drop);
        } else if (isPetDrop(drop)) {
            pets.push(drop);
        } else if (drop.type === 'stash_ingredient') {
            stashIngredients.push(drop);
        } else {
            items.push(drop);
        }
    }

    const sections = [];

    const addGridSection = (title, list, renderFn, extraOpts = {}) => {
        if (!list.length) return;
        const colsCount = list.length > 1 ? 2 : 1;
        const colsClass = colsCount === 2 ? 'grid-cols-2' : 'grid-cols-1';
        const rowsCount = Math.ceil(list.length / colsCount);
        const rowWeight = extraOpts.rowWeight || 3.4;
        const weight = 1.4 + rowsCount * rowWeight;

        sections.push({
            weight,
            html: `
                <div class="flex flex-col items-center w-full min-w-0 max-w-full">
                    <div class="${categoryTitleClass}">${title}</div>
                    <div class="grid ${colsClass} gap-1.5 justify-items-center items-center w-full min-w-0">
                        ${list.map(renderFn).join('')}
                    </div>
                </div>
            `
        });
    };

    const compactMutagen = mutagens.length > 5;
    addGridSection('Мутагены', mutagens, m => renderWebpSquare64(m, 'МУТАГЕН', { compactMutagen }), {
        rowWeight: compactMutagen ? 2.8 : 3.4
    });
    addGridSection('Оружие', weapons, w => renderWebpSquare64(w, 'WEAPON'));
    addGridSection('Комната', rooms, r => renderWebpSquare64(r, 'ROOM'), { rowWeight: 4.2 });
    addGridSection('Питомцы', pets, p => renderWebpSquare64(p, 'PET'));
    addGridSection('Предмет', items, it => renderWebpSquare64(it, it.type || 'ITEM'));
    addGridSection('Набор', stashIngredients, s => renderWebpSquare64(s, 'STASH'));

    const compactClothing = clothingDrops.length > 1;
    addGridSection('Одежда', clothingDrops, c => renderWebpSquare64(c, c.type || 'CLOTHING', { compactClothing }), {
        rowWeight: compactClothing ? 2.8 : 3.4
    });

    const ornamentsSection = renderOrnamentBodyBlock(ornamentDrops);
    if (ornamentsSection) {
        const ornamentRows = Math.max(1, Math.ceil(ornamentDrops.length / 2));
        sections.push({
            weight: 1.4 + ornamentRows * 2.0,
            html: ornamentsSection
        });
    }

    if (!sections.length) return '';

    const numCols = Math.min(3, sections.length);
    const cols = Array.from({ length: numCols }, () => ({ weight: 0, parts: [] }));

    
    const sortedSections = [...sections].sort((a, b) => b.weight - a.weight);

    for (const sec of sortedSections) {
        let minCol = cols[0];
        for (let i = 1; i < cols.length; i++) {
            if (cols[i].weight < minCol.weight) {
                minCol = cols[i];
            }
        }
        minCol.parts.push(sec.html);
        minCol.weight += sec.weight;
    }

    const activeCols = cols
        .filter(c => c.parts.length > 0)
        .map(c => c.parts.join('<div class="h-2"></div>'));

    const gridColsClass = activeCols.length === 1
        ? 'grid-cols-1'
        : (activeCols.length === 2 ? 'grid-cols-2' : 'grid-cols-3');

    return `
        <div class="grid ${gridColsClass} gap-1.5 items-start w-full min-w-0">
            ${activeCols.map(colHtml => `<div class="flex flex-col items-center justify-start min-w-0 max-w-full">${colHtml}</div>`).join('')}
        </div>
    `;
}

                    const option = document.createElement('option');
                    option.value = floorCode;
                    option.textContent = sector === '$'
                        ? `Специальный этаж $ (${floorCode})`
                        : `Этаж ${sector}, часть ${floorCode.slice(1)} (${floorCode})`;
                    select.appendChild(option);
                }
            }
        }

        function getFloorAndPart(id) {
            return BOSS_FLOOR_BY_ID[Number(id)] || {
                floor: '?',
                sector: '?',
                floorName: 'Этаж не найден по ID'
            };
        }

        function getFloorNeonStyle(floorStr) {
            const letter = floorStr.charAt(0);
            const data = {
                'A': { color: '#00f0ff', shadow: 'rgba(0,240,255,0.25)' },
                'B': { color: '#00ff66', shadow: 'rgba(0,255,102,0.25)' },
                'C': { color: '#ffe600', shadow: 'rgba(255,230,0,0.25)' },
                'D': { color: '#7000ff', shadow: 'rgba(112,0,255,0.25)' },
                'E': { color: '#ff0055', shadow: 'rgba(255,0,85,0.25)' },
                'F': { color: '#2dd4bf', shadow: 'rgba(45,212,191,0.25)' },
                'G': { color: '#fbbf24', shadow: 'rgba(251,191,36,0.25)' },
                'H': { color: '#818cf8', shadow: 'rgba(129,140,248,0.25)' },
                'I': { color: '#fb7185', shadow: 'rgba(251,113,133,0.25)' },
                'J': { color: '#34d399', shadow: 'rgba(52,211,153,0.25)' },
                'K': { color: '#67e8f9', shadow: 'rgba(103,232,249,0.25)' },
                'L': { color: '#e879f9', shadow: 'rgba(232,121,249,0.25)' },
                'M': { color: '#a3e635', shadow: 'rgba(163,230,53,0.25)' },
                'N': { color: '#fb923c', shadow: 'rgba(251,146,60,0.25)' },
                'O': { color: '#a78bfa', shadow: 'rgba(167,139,250,0.25)' },
                '$': { color: '#fde047', shadow: 'rgba(253,224,71,0.3)' }
            };
            return data[letter] || { color: '#00f0ff', shadow: 'rgba(0,240,255,0.25)' };
        }

        function getBossTitleFontClass(name) {
            const len = (name || '').trim().length;
            if (len > 36) return 'text-xs sm:text-sm leading-tight';
            if (len > 24) return 'text-sm sm:text-base leading-tight';
            if (len > 14) return 'text-base sm:text-lg leading-tight';
            return 'text-lg sm:text-xl leading-tight';
        }

        function renderBosses(bosses) {
            const grid = document.getElementById('bossesGrid');
            document.getElementById('bossCountDisplay').innerText = bosses.length;

            if (!bosses || bosses.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-red-400 font-mono">Боссы по заданным критериям не найдены (или файлы bosses/*.json ещё не добавлены).</div>`;
                return;
            }

            grid.innerHTML = bosses.map(b => {
                const drops = b.possibleDrops || [];
                const floorInfo = getFloorAndPart(b.id);
                const floorStyle = getFloorNeonStyle(floorInfo.floor);
                const cardStyleAttr = 'border-color: #7f1d1d; box-shadow: 0 0 18px rgba(185, 28, 28, 0.25);';

                const dropsSquaresHtml = renderBossDropsLayout(drops);

                const rewards = b.rewardPreview || {};
                const rewardsArray = [];
                if (rewards.gold) rewardsArray.push(`<span>+${rewards.gold.toLocaleString()} 🪙</span>`);
                if (rewards.exp) rewardsArray.push(`<span>+${rewards.exp.toLocaleString()} ✨</span>`);
                if (rewards.dollar) rewardsArray.push(`<span>+${rewards.dollar.toLocaleString()} 💵</span>`);
                if (rewards.pills) rewardsArray.push(`<span>+${rewards.pills.toLocaleString()} 💊</span>`);
                const rewardsHtml = rewardsArray.length > 0 ? rewardsArray.join(' &nbsp; ') : '<span class="text-gray-500">Нет</span>';

                const topKillerObj = b.topKiller;
                let topKillerText = '-';
                if (topKillerObj) {
                    const kills = topKillerObj.killCount !== undefined ? ` (${topKillerObj.killCount.toLocaleString()})` : '';
                    topKillerText = (topKillerObj.nickname && topKillerObj.nickname !== 'null')
                        ? `${topKillerObj.nickname}${kills}`
                        : `ID: ${topKillerObj.userId}${kills}`;
                }

                const fightDurationMinutes = b.maxFightDurationSeconds ? Math.round(b.maxFightDurationSeconds / 60) : 60;
                const bossTitle = b.nameRu || 'Неизвестный босс';
                const bossTitleFontClass = getBossTitleFontClass(bossTitle);
                const bossImgCandidates = JSON.stringify([
                    `data/bosses_prew/P${b.id}.webp`,
                ]).replace(/"/g, '&quot;');

                return `
                    <div class="boss-card relative overflow-hidden bg-cyber-card border-2 rounded-xl p-4 shadow-xl transition flex flex-col justify-between space-y-3" style="${cardStyleAttr}">

                        <div class="relative z-10 flex flex-col justify-between space-y-3">
                            
                            <div class="flex flex-col items-center text-center border-b border-cyber-border pb-3 gap-2.5">
                                <h2 class="boss-title-clamp font-orbitron font-extrabold text-red-500 uppercase tracking-wide ${bossTitleFontClass}">
                                    ${bossTitle}
                                </h2>

                                <div class="flex items-center justify-center gap-3 w-full">
                                    <div
                                        data-zoom-trigger="1"
                                        data-label="${bossTitle.replace(/"/g, '&quot;')}"
                                        onclick="toggleClickZoom(event, this)"
                                        style="background: linear-gradient(145deg, #2b090e 0%, #120406 100%);"
                                        class="w-32 h-32 shrink-0 rounded-xl border-2 border-red-900/80 hover:border-cyber-accent overflow-hidden flex items-center justify-center cursor-pointer transition"
                                    >
                                        <img
                                            src="data/bosses_prew/P${b.id}.webp"
                                            data-fallbacks="${bossImgCandidates}"
                                            data-fallback-idx="0"
                                            alt="${bossTitle}"
                                            onerror="handleImgFallback(this)"
                                            class="w-full h-full object-contain p-1 select-none"
                                        >
                                        <span style="display:none;" class="w-full h-full text-red-200 font-mono text-xs font-bold items-center justify-center text-center p-2">
                                            BOSS #${b.id}
                                        </span>
                                    </div>

                                    
                                    <div class="text-left text-xs font-mono bg-[#09090c] p-2.5 rounded-lg border border-red-950/90 space-y-1 min-w-0 flex-1">
                                        <div class="truncate"><span class="text-zinc-400">ID:</span> <span class="text-purple-400 font-bold">#${b.id}</span></div>
                                        <div class="truncate"><span class="text-zinc-400">Этаж:</span> <span class="text-red-400 font-bold">${floorInfo.floor}</span></div>
                                        <div class="truncate"><span class="text-zinc-400">HP:</span> <span class="text-red-500 font-bold">${b.maxHp ? b.maxHp.toLocaleString() : 0} ❤️</span></div>
                                        <div class="truncate"><span class="text-zinc-400">Уровень:</span> <span class="text-sky-400 font-bold">${b.requiredLevel} – ${b.rewardUntilLevel}</span></div>
                                        <div class="truncate"><span class="text-zinc-400">Урон:</span> <span class="text-orange-400 font-bold">${b.damageMin} - ${b.damageMax}</span></div>
                                    </div>
                                </div>
                            </div>

                            
                            <div class="text-xs font-mono bg-[#090405] p-2.5 rounded-lg border border-[#3b1116] space-y-2">
                                <div class="grid grid-cols-2 gap-2">
                                    <div class="truncate"><span class="text-red-300/70">Время:</span> <span class="text-red-100 font-bold">${fightDurationMinutes} мин</span></div>
                                    <div class="truncate"><span class="text-red-300/70">Участников:</span> <span class="text-red-100 font-bold">до ${b.maxParticipants || 50}</span></div>
                                </div>

                                <div class="pt-2 border-t border-[#3b1116]/80 flex items-center justify-between gap-2">
                                    <span class="text-red-300/70 shrink-0">Топ:</span>
                                    <b class="text-red-200 font-bold truncate max-w-[210px]">${topKillerText}</b>
                                </div>

                                <div class="bg-[#14080a] border border-red-700/70 rounded-md px-2.5 py-2 flex items-center justify-between gap-2 shadow-[0_0_10px_rgba(220,38,38,0.18)]">
                                    <span class="text-[11px] font-orbitron font-bold uppercase tracking-wider text-red-400 shrink-0">Награды:</span>
                                    <div class="text-xs font-mono text-red-100 font-bold flex flex-wrap justify-end items-center gap-2">${rewardsHtml}</div>
                                </div>
                            </div>

                            

                           
                            <div class="mt-1 space-y-2">
                                
                                ${dropsSquaresHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const selectedFloor = document.getElementById('floorFilter').value;
            const playerLevel = parseInt(document.getElementById('playerLevelInput').value);

            const needGold = document.getElementById('filterGold').checked;
            const needPills = document.getElementById('filterPills').checked;
            const needClothing = document.getElementById('filterClothing').checked;
            const needOrnaments = document.getElementById('filterOrnaments').checked;
            const needWeapons = document.getElementById('filterWeapons').checked;
            const needPets = document.getElementById('filterPets').checked;
            const needRooms = document.getElementById('filterRooms').checked;
            const needSets = document.getElementById('filterSets').checked;

            const filtered = allBossesData.filter(b => {
                const floorInfo = getFloorAndPart(b.id);

                const matchesSearch = (b.nameRu && b.nameRu.toLowerCase().includes(query)) ||
                    b.id.toString().includes(query) ||
                    floorInfo.floor.toLowerCase().includes(query);
                if (!matchesSearch) return false;

                if (selectedFloor && floorInfo.floor !== selectedFloor) return false;

                if (!isNaN(playerLevel)) {
                    const minLvl = b.requiredLevel || 0;
                    const maxLvl = b.rewardUntilLevel || 999;
                    if (playerLevel < minLvl || playerLevel > maxLvl) return false;
                }

                const drops = b.possibleDrops || [];
                const rewards = b.rewardPreview || {};

                if (needGold && (!rewards.gold || rewards.gold <= 0)) return false;
                if (needPills && (!rewards.pills || rewards.pills <= 0)) return false;
                if (needClothing && !drops.some(d => d.type === 'clothing_item')) return false;
                if (needOrnaments && !drops.some(d => d.type === 'ornament')) return false;
                if (needWeapons && !drops.some(d => d.type === 'weapon' || d.type === 'weapon_item')) return false;
                if (needPets && !drops.some(d => d.type === 'pet' || d.type === 'pet_item')) return false;
                if (needRooms && !drops.some(d => d.type === 'room')) return false;
                if (needSets && !drops.some(d => d.type === 'stash_ingredient')) return false;

                return true;
            });

            renderBosses(filtered);
        }
        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('floorFilter').value = '';
            document.getElementById('playerLevelInput').value = '';
            document.getElementById('filterGold').checked = false;
            document.getElementById('filterPills').checked = false;
            document.getElementById('filterClothing').checked = false;
            document.getElementById('filterOrnaments').checked = false;
            document.getElementById('filterWeapons').checked = false;
            document.getElementById('filterPets').checked = false;
            document.getElementById('filterRooms').checked = false;
            document.getElementById('filterSets').checked = false;
            renderBosses(allBossesData);
        }

        loadBossesFiles()
    </script>
</body>
</html>
